<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF6B9D" />
  <title>Privacy – Sudoku Kids &amp; Crazy Grids</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #FFF5FA; color: #3D2C6B; margin: 0; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 20px 48px; }
    h1 { font-size: 24px; margin: 16px 0 0; } h2 { font-size: 18px; margin-top: 28px; }
    .back { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin: 8px 0 4px; padding: 6px 20px 6px 8px;
            background: #EDD9FF; color: #3D2C6B; border-radius: 50px; font-weight: 800; text-decoration: none; }
    .back svg { width: 36px; height: 36px; display: block; }
    .langs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .langs button { min-height: 48px; padding: 6px 16px; border-radius: 50px; border: 3px solid transparent; background: #fff; color: #3D2C6B;
                    font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 10px rgba(100,60,120,.15); }
    .langs button[aria-pressed="true"] { border-color: #3D2C6B; background: #FFD93D; }
    .updated { font-style: italic; margin-top: 0; }
  </style>
</head>
<body>
<main>
  <a class="back" id="back-top" href="./"><span data-icon="back"></span><span data-text="back"></span></a>
  <!-- the policy in five languages; starts in the language of the app, otherwise English -->
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
  <article id="policy"></article>
  <a class="back" href="./"><span data-icon="back"></span><span data-text="back"></span></a>
</main>

<script src="storage.js"></script>
<script src="icons.js"></script>
<script>
(function () {
  'use strict';

    en: {

      notTitle: 'What the app does not do',
      not: ['No accounts, no sign-in, no e-mail addresses.', 'No advertising.', 'No tracking, no analytics, no third-party cookies.', 'No in-app purchases.',
            'No access to camera, microphone, location, contacts or files.', 'No push notifications and no links to other websites or social media.'],
      storedTitle: 'What is stored on the device',
      stored: 'The app only stores on the device itself: the stars and times per level, which puzzles have been played (a history of the last 500 puzzles at most), the badges that were earned, the notifications inside the app, the game in progress, and the settings (sound, music, language, display, size). You can create up to six profiles with an animal picture and, if you wish, a name or nickname. The name is optional and also stays on the device only. This data never leaves the device and is not shared with anyone. You can delete it via <em>Settings → Reset all progress</em>, by deleting a profile, or by uninstalling the app.',
      netTitle: 'Internet',
      net: 'The app only downloads its own files from the website it is hosted on, so that it can be played offline afterwards. Like any web server, the server may briefly log technical data such as the IP address. The app itself sends nothing.',
      askTitle: 'Questions',
      ask: 'Questions about this policy? Use the developer contact details on the app\'s Google Play page.'
    },
    nl: {
      name: 'Nederlands', back: 'Terug naar het spel', title: 'Privacyverklaring', updated: 'laatst bijgewerkt op',
      intro: 'Deze app is gemaakt voor kinderen. Daarom is hij zo gebouwd dat er <strong>geen gegevens verzameld worden</strong>.',
      notTitle: 'Wat de app niet doet',
      not: ['Geen accounts, geen inloggen, geen e-mailadressen.', 'Geen advertenties.', 'Geen tracking, geen statistieken, geen cookies van derden.', 'Geen aankopen in de app.',
            'Geen toegang tot camera, microfoon, locatie, contacten of bestanden.', 'Geen pushmeldingen en geen links naar andere websites of sociale media.'],
      storedTitle: 'Wat er op het toestel wordt bewaard',
      stored: 'De app bewaart alleen op het eigen toestel: de behaalde sterren en tijden per level, welke puzzels al gespeeld zijn (een geschiedenis van hoogstens de laatste 500 puzzels), de behaalde badges, de meldingen in de app, het spel waar je mee bezig bent, en de instellingen (geluid, muziek, taal, weergave, grootte). Je kunt tot zes profielen maken met een dierenplaatje en, als je dat wilt, een naam of bijnaam. Die naam is niet verplicht en blijft ook alleen op het toestel. Deze gegevens verlaten het toestel nooit en worden met niemand gedeeld. Je wist ze via <em>Instellingen → Reset alle voortgang</em>, door een profiel te verwijderen of door de app te verwijderen.',
      netTitle: 'Internet',
      net: 'De app haalt alleen zijn eigen bestanden op bij de website waar hij staat, zodat je daarna ook zonder internet kunt spelen. De webserver kan daarbij, zoals elke webserver, technische gegevens zoals het IP-adres kort vastleggen. De app zelf stuurt niets mee.',
      askTitle: 'Vragen',
      ask: 'Vragen over deze verklaring? Neem contact op via de contactgegevens van de ontwikkelaar op de pagina van de app in Google Play.'
    },
    es: {
      name: 'Español', back: 'Volver al juego', title: 'Política de privacidad', updated: 'última actualización:',
      intro: 'Esta aplicación está hecha para niños. Está diseñada para que <strong>no se recopile ningún dato</strong>.',
      notTitle: 'Lo que la aplicación no hace',
      not: ['Sin cuentas, sin inicio de sesión, sin direcciones de correo electrónico.', 'Sin publicidad.', 'Sin rastreo, sin estadísticas, sin cookies de terceros.', 'Sin compras dentro de la aplicación.',
            'Sin acceso a la cámara, el micrófono, la ubicación, los contactos ni los archivos.', 'Sin notificaciones push y sin enlaces a otros sitios web o redes sociales.'],
      storedTitle: 'Lo que se guarda en el dispositivo',
      stored: 'La aplicación solo guarda en el propio dispositivo: las estrellas y los tiempos de cada nivel, qué puzles se han jugado (un historial de los últimos 500 puzles como máximo), las insignias conseguidas, los avisos dentro de la aplicación, la partida en curso y los ajustes (sonido, música, idioma, visualización, tamaño). Se pueden crear hasta seis perfiles con un dibujo de un animal y, si se quiere, un nombre o apodo. El nombre es opcional y también se queda solo en el dispositivo. Estos datos nunca salen del dispositivo y no se comparten con nadie. Se pueden borrar en <em>Ajustes → Borrar todo el progreso</em>, eliminando un perfil o desinstalando la aplicación.',
      netTitle: 'Internet',
      net: 'La aplicación solo descarga sus propios archivos del sitio web donde está alojada, para que después se pueda jugar sin conexión. Como cualquier servidor web, el servidor puede registrar brevemente datos técnicos como la dirección IP. La aplicación en sí no envía nada.',
      askTitle: 'Preguntas',
      ask: '¿Preguntas sobre esta política? Utiliza los datos de contacto del desarrollador en la página de la aplicación en Google Play.'
    },
    pt: {
      name: 'Português', back: 'Voltar ao jogo', title: 'Política de privacidade', updated: 'última atualização:',
      intro: 'Este aplicativo foi feito para crianças. Ele foi construído para que <strong>nenhum dado seja coletado</strong>.',
      notTitle: 'O que o aplicativo não faz',
      not: ['Sem contas, sem login, sem endereços de e-mail.', 'Sem publicidade.', 'Sem rastreamento, sem estatísticas, sem cookies de terceiros.', 'Sem compras no aplicativo.',
            'Sem acesso à câmera, ao microfone, à localização, aos contatos ou aos arquivos.', 'Sem notificações push e sem links para outros sites ou redes sociais.'],
      storedTitle: 'O que fica guardado no aparelho',
      stored: 'O aplicativo guarda apenas no próprio aparelho: as estrelas e os tempos de cada nível, quais quebra-cabeças já foram jogados (um histórico de no máximo os últimos 500), as medalhas conquistadas, os avisos dentro do aplicativo, o jogo em andamento e as configurações (som, música, idioma, exibição, tamanho). É possível criar até seis perfis com a imagem de um animal e, se quiser, um nome ou apelido. O nome é opcional e também fica apenas no aparelho. Esses dados nunca saem do aparelho e não são compartilhados com ninguém. Você pode apagá-los em <em>Configurações → Apagar todo o progresso</em>, excluindo um perfil ou desinstalando o aplicativo.',
      netTitle: 'Internet',
      net: 'O aplicativo só baixa os próprios arquivos do site em que está hospedado, para que depois possa ser jogado sem internet. Como qualquer servidor web, o servidor pode registrar por pouco tempo dados técnicos, como o endereço IP. O aplicativo em si não envia nada.',
      askTitle: 'Dúvidas',
      ask: 'Dúvidas sobre esta política? Use os dados de contato do desenvolvedor na página do aplicativo no Google Play.'
    },
    id: {
      name: 'Bahasa Indonesia', back: 'Kembali ke permainan', title: 'Kebijakan privasi', updated: 'terakhir diperbarui',
      intro: 'Aplikasi ini dibuat untuk anak-anak. Aplikasi ini dirancang agar <strong>tidak ada data yang dikumpulkan</strong>.',
      notTitle: 'Yang tidak dilakukan aplikasi',
      not: ['Tanpa akun, tanpa login, tanpa alamat email.', 'Tanpa iklan.', 'Tanpa pelacakan, tanpa analitik, tanpa cookie pihak ketiga.', 'Tanpa pembelian dalam aplikasi.',
            'Tanpa akses ke kamera, mikrofon, lokasi, kontak, atau file.', 'Tanpa notifikasi push dan tanpa tautan ke situs web lain atau media sosial.'],
      storedTitle: 'Yang disimpan di perangkat',
      stored: 'Aplikasi hanya menyimpan di perangkat itu sendiri: bintang dan waktu tiap level, teka-teki mana yang sudah dimainkan (riwayat paling banyak 500 teka-teki terakhir), lencana yang didapat, pemberitahuan di dalam aplikasi, permainan yang sedang berlangsung, dan pengaturan (suara, musik, bahasa, tampilan, ukuran). Kamu dapat membuat hingga enam profil dengan gambar hewan dan, jika mau, nama atau nama panggilan. Nama tidak wajib dan juga hanya tersimpan di perangkat. Data ini tidak pernah keluar dari perangkat dan tidak dibagikan kepada siapa pun. Data dapat dihapus lewat <em>Pengaturan → Hapus semua kemajuan</em>, dengan menghapus profil, atau dengan mencopot aplikasi.',
      netTitle: 'Internet',
      net: 'Aplikasi hanya mengunduh file miliknya sendiri dari situs web tempatnya berada, agar setelah itu dapat dimainkan tanpa internet. Seperti server web lainnya, server dapat mencatat sebentar data teknis seperti alamat IP. Aplikasi itu sendiri tidak mengirim apa pun.',
      askTitle: 'Pertanyaan',
      ask: 'Ada pertanyaan tentang kebijakan ini? Gunakan kontak pengembang di halaman aplikasi di Google Play.'
    }
  };
  var ORDER = ['en', 'nl', 'es', 'pt', 'id'];

  // Start in the language of the app (the active profile), otherwise English.
  function appLanguage() {
    try {
      var asked = new URLSearchParams(location.search).get('lang');
      if (TEXT[asked]) return asked;
      // the app uses the saved language of the player, or else the language of the device
      var settings = window.SudokuStorage.read(window.SudokuStorage.activeId(), 'settings');
      var app = settings && settings.language ? settings.language : String(navigator.language || 'en').slice(0, 2).toLowerCase();
      if (TEXT[app]) return app;
    } catch (e) { /* storage blocked */ }
    return 'en';
  }

  function show(lang) {
    var T = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = T.title + ' – Sudoku Kids & Crazy Grids';
    document.getElementById('policy').innerHTML =
      '<h1>' + T.title + '</h1><p class="updated">Sudoku Kids &amp; Crazy Grids – ' + T.updated + ' ' + UPDATED[lang] + '</p>' +
      '<p>' + T.intro + '</p>' +
      '<h2>' + T.notTitle + '</h2><ul>' + T.not.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<h2>' + T.storedTitle + '</h2><p>' + T.stored + '</p>' +
      '<h2>' + T.netTitle + '</h2><p>' + T.net + '</p>' +
      '<h2>' + T.askTitle + '</h2><p>' + T.ask + '</p>';
    document.querySelectorAll('[data-text="back"]').forEach(function (el) { el.textContent = T.back; });
    document.querySelectorAll('#langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
  }

  document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = window.KawaiiIcons.svg(el.dataset.icon); });
  var langs = document.getElementById('langs');
  ORDER.forEach(function (code) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = code;
    b.lang = code;
    b.textContent = TEXT[code].name;
    b.addEventListener('click', function () { show(code); });
    langs.appendChild(b);
  });
  show(appLanguage());
})();
</script>
</body>
</html>
