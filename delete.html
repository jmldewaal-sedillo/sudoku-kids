  // Start in the language of the app (the saved language of the player, or else the device), otherwise English.
  function appLanguage() {
    try {
      var asked = new URLSearchParams(location.search).get('lang');
      if (TEXT[asked]) return asked;
      var settings = window.SudokuStorage.read(window.SudokuStorage.activeId(), 'settings');
      var app = settings && settings.language ? settings.language : String(navigator.language || 'en').slice(0, 2).toLowerCase();
      if (TEXT[app]) return app;
    } catch (e) { /* storage blocked */ }
    return 'en';
  }
  function show(lang) {
    var T = TEXT[lang];
    var mail = '<a href="mailto:' + MAIL + '">' + MAIL + '</a>';
    document.documentElement.lang = lang;
    document.title = T.title + ' – Sudoku Kids & Crazy Grids';
    document.getElementById('policy').innerHTML =
      '<h1>' + T.title + '</h1><p class="updated">' + T.sub + '</p>' +
      T.sections.map(function (s) { return '<h2>' + s[0] + '</h2>' + s[1].split('{mail}').join(mail); }).join('');
    document.querySelectorAll('[data-text="back"]').forEach(function (el) { el.textContent = BACK[lang]; });
    document.querySelectorAll('#langs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
  }
  document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = window.KawaiiIcons.svg(el.dataset.icon); });
  var langs = document.getElementById('langs');
  ORDER.forEach(function (code) {
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.lang = code; b.lang = code; b.textContent = NAMES[code];
    b.addEventListener('click', function () { show(code); });
    langs.appendChild(b);
  });
  show(appLanguage());
